<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GroupMe Likes</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#677084; --line:#e2e5eb; --accent:#00aff0; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 40px; }
  header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px; }
  h1 { font-size:22px; margin:0; }
  .status { color:var(--muted); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  label.check { flex-direction:row; align-items:center; font-size:14px; color:var(--text); min-height:38px; }
  input[type=search], input[type=date], input[type=password], select { font:inherit; font-size:16px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; min-width:170px; }
  button { font:inherit; padding:8px 14px; border-radius:7px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; min-height:38px; }
  button.secondary { background:#fff; color:var(--accent); }
  button:disabled { opacity:.55; cursor:wait; }
  .error { background:#fdecec; color:#9b1c1c; border:1px solid #f5c2c2; padding:10px 12px; border-radius:8px; margin-bottom:12px; }
  .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:#fafbfc; position:sticky; top:0; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--text); }
  td.time { white-space:nowrap; color:var(--muted); font-size:13px; }
  td.sender { white-space:nowrap; font-weight:600; }
  td.text { overflow-wrap:anywhere; min-width:240px; }
  td.likes { text-align:right; font-variant-numeric:tabular-nums; }
  td.likedby { color:var(--muted); font-size:13px; min-width:160px; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
  #login { max-width:360px; margin:12vh auto 0; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; display:flex; flex-direction:column; gap:12px; }
  #login h1 { font-size:20px; }
</style>
</head>
<body>
<main>
  <form id="login" hidden>
    <h1>GroupMe Likes</h1>
    <label>Password <input type="password" id="password" autocomplete="current-password" required></label>
    <div class="error" id="loginError" role="alert" hidden></div>
    <button type="submit">Open</button>
  </form>

  <div id="app" hidden>
    <header>
      <div>
        <h1 id="title">GroupMe Likes</h1>
        <div class="status" id="status" aria-live="polite"></div>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap">
        <button id="refresh" type="button">Refresh</button>
        <button id="resync" type="button" class="secondary" title="Re-download all history to update like counts on older messages">Re-sync all</button>
        <button id="logout" type="button" class="secondary">Log out</button>
      </div>
    </header>

    <div class="error" id="error" role="alert" hidden></div>

    <form class="controls" onsubmit="return false">
      <label>From <input type="date" id="from"></label>
      <label>To <input type="date" id="to"></label>
      <label><span id="likerLabel">Liked by</span> <input type="search" id="liker" placeholder="name contains…"></label>
      <label>Sort
        <select id="sort">
          <option value="time:desc">Newest first</option>
          <option value="time:asc">Oldest first</option>
          <option value="likes:desc">Most likes</option>
          <option value="likes:asc">Fewest likes</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="zero"> Zero likes only</label>
      <label class="check"><input type="checkbox" id="notliked"> Show who hasn't liked</label>
    </form>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="sortable" data-sort="time">Time</th>
            <th>Sender</th>
            <th>Text</th>
            <th class="sortable" data-sort="likes">Likes</th>
            <th id="likedHeader">Liked by</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden></div>
    </div>
  </div>
</main>

<script>
// rows from /api/data: t = epoch seconds, s = sender, x = text, n = like count,
// l = liked by, nl = hasn't liked (already excludes sender, admins, NOT_LIKED_EXCLUDE)
const MAX_ROWS = 1000;
const PW_KEY = 'groupmeLikesPassword';
const $ = id => document.getElementById(id);
let DATA = null;
let debounce;

function getPw() { try { return localStorage.getItem(PW_KEY) || ''; } catch { return ''; } }
function setPw(v) { try { v ? localStorage.setItem(PW_KEY, v) : localStorage.removeItem(PW_KEY); } catch {} }

function showError(msg) { $('error').textContent = msg || ''; $('error').hidden = !msg; }

function showLogin(msg) {
  $('app').hidden = true;
  $('login').hidden = false;
  $('loginError').textContent = msg || '';
  $('loginError').hidden = !msg;
  $('password').focus();
}

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'x-app-password': getPw() } });
  let body;
  try { body = await res.json(); } catch { body = {}; }
  if (res.status === 401) { setPw(''); showLogin(body.error || 'Wrong password.'); throw new Error('locked'); }
  if (!res.ok) throw new Error(body.error || `Request failed (${res.status})`);
  return body;
}

function fmtTime(ts) {
  return new Date(ts * 1000).toLocaleString(undefined, {
    year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'
  });
}

function td(cls, text) {
  const el = document.createElement('td');
  el.className = cls;
  el.textContent = text ?? '';
  return el;
}

function render() {
  if (!DATA) return;
  const [sort, dir] = $('sort').value.split(':');
  const notLiked = $('notliked').checked;
  const label = notLiked ? "Hasn't liked" : 'Liked by';
  $('likedHeader').textContent = label;
  $('likerLabel').textContent = label;

  // "From" starts at local midnight; "To" covers the whole selected day.
  const start = $('from').value ? new Date($('from').value + 'T00:00').getTime() / 1000 : null;
  let end = null;
  if ($('to').value) {
    const d = new Date($('to').value + 'T00:00');
    d.setDate(d.getDate() + 1);
    end = d.getTime() / 1000;
  }
  const who = $('liker').value.trim().toLowerCase();

  const rows = DATA.rows.filter(r =>
    (!$('zero').checked || r.n === 0) &&
    (start === null || r.t >= start) &&
    (end === null || r.t < end) &&
    (!who || (notLiked ? r.nl : r.l).some(name => name.toLowerCase().includes(who)))
  );
  const sign = dir === 'asc' ? 1 : -1;
  rows.sort(sort === 'likes'
    ? (a, b) => sign * (a.n - b.n) || b.t - a.t
    : (a, b) => sign * (a.t - b.t));

  const shown = rows.slice(0, MAX_ROWS);
  const tbody = $('rows');
  tbody.replaceChildren();
  for (const r of shown) {
    const tr = document.createElement('tr');
    tr.append(
      td('time', fmtTime(r.t)),
      td('sender', r.s),
      td('text', r.x || '(no text — attachment)'),
      td('likes', r.n),
      td('likedby', (notLiked ? r.nl : r.l).join(', ') || '—'),
    );
    tbody.append(tr);
  }
  const empty = $('empty');
  empty.textContent = DATA.rows.length === 0
    ? 'No messages yet. Click Refresh to download the group history.'
    : 'No messages match these filters.';
  empty.hidden = shown.length > 0;

  const count = shown.length < rows.length
    ? `Showing first ${shown.length} of ${rows.length} matches`
    : `${rows.length} match${rows.length === 1 ? '' : 'es'}`;
  const synced = DATA.lastSync ? ` · updated ${fmtTime(DATA.lastSync)}` : '';
  $('status').textContent = `${count} · ${DATA.rows.length} messages${synced}`;
}

async function loadData() {
  DATA = await api('/api/data');
  if (DATA.group) { $('title').textContent = DATA.group; document.title = DATA.group + ' · Likes'; }
  render();
}

async function refresh(full) {
  const btns = [$('refresh'), $('resync')];
  btns.forEach(b => b.disabled = true);
  showError('');
  $('status').textContent = full ? 'Re-downloading all history…' : 'Checking GroupMe for new messages…';
  try {
    // Long downloads come back in chunks; keep calling with the cursor until done.
    let cursor = null, fetched = 0;
    do {
      const q = new URLSearchParams();
      if (full) q.set('full', '1');
      if (cursor) q.set('cursor', cursor);
      const r = await api('/api/refresh?' + q, { method: 'POST' });
      fetched += r.fetched;
      cursor = r.more ? r.cursor : null;
      if (cursor) $('status').textContent = `Downloading… ${fetched} messages so far`;
    } while (cursor);
    await loadData();
  } catch (e) {
    if (e.message !== 'locked') showError(e.message);
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}

async function start() {
  $('login').hidden = true;
  $('app').hidden = false;
  try {
    await loadData();     // show what's saved right away
    await refresh(false); // then pull anything new from GroupMe
  } catch (e) {
    if (e.message !== 'locked') showError(e.message);
  }
}

$('login').addEventListener('submit', e => {
  e.preventDefault();
  setPw($('password').value);
  $('password').value = '';
  start();
});
$('logout').addEventListener('click', () => { setPw(''); DATA = null; $('rows').replaceChildren(); showLogin(); });
$('refresh').addEventListener('click', () => refresh(false));
$('resync').addEventListener('click', () => refresh(true));
['sort', 'zero', 'notliked', 'from', 'to'].forEach(id => $(id).addEventListener('change', render));
$('liker').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 150); });
document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
  const [cur, dir] = $('sort').value.split(':');
  const key = th.dataset.sort;
  $('sort').value = `${key}:${cur === key && dir === 'desc' ? 'asc' : 'desc'}`;
  render();
}));

getPw() ? start() : showLogin();
</script>
</body>
</html>
