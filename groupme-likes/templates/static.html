<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>GroupMe Likes</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1d2330; --muted:#677084; --line:#e2e5eb; --accent:#00aff0; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, Segoe UI, sans-serif; background:var(--bg); color:var(--text); }
  main { max-width:1200px; margin:0 auto; padding:20px 16px 40px; }
  header { margin-bottom:16px; }
  h1 { font-size:22px; margin:0; }
  .status { color:var(--muted); font-size:13px; }
  .controls { display:flex; flex-wrap:wrap; gap:10px; align-items:end; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:12px; }
  label { display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted); }
  label.check { flex-direction:row; align-items:center; font-size:14px; color:var(--text); min-height:38px; }
  input[type=search], input[type=date], select { font:inherit; font-size:16px; padding:7px 9px; border:1px solid var(--line); border-radius:7px; min-width:170px; }
  .table-wrap { overflow-x:auto; background:var(--card); border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; text-transform:uppercase; letter-spacing:.03em; color:var(--muted); background:#fafbfc; position:sticky; top:0; }
  th.sortable { cursor:pointer; user-select:none; }
  th.sortable:hover { color:var(--text); }
  td.time { white-space:nowrap; color:var(--muted); font-size:13px; }
  td.sender { white-space:nowrap; font-weight:600; }
  td.text { overflow-wrap:anywhere; min-width:240px; }
  td.likes { text-align:right; font-variant-numeric:tabular-nums; }
  td.likedby { color:var(--muted); font-size:13px; min-width:160px; }
  .empty { padding:30px; text-align:center; color:var(--muted); }
</style>
</head>
<body>
<main>
  <header>
    <h1 id="title">GroupMe Likes</h1>
    <div class="status" id="status" aria-live="polite"></div>
  </header>

  <form class="controls" onsubmit="return false">
    <label>From <input type="date" id="from"></label>
    <label>To <input type="date" id="to"></label>
    <label><span id="likerLabel">Liked by</span> <input type="search" id="liker" placeholder="name contains…"></label>
    <label>Sort
      <select id="sort">
        <option value="time:desc">Newest first</option>
        <option value="time:asc">Oldest first</option>
        <option value="likes:desc">Most likes</option>
        <option value="likes:asc">Fewest likes</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="zero"> Zero likes only</label>
    <label class="check"><input type="checkbox" id="notliked"> Show who hasn't liked</label>
  </form>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th class="sortable" data-sort="time">Time</th>
          <th>Sender</th>
          <th>Text</th>
          <th class="sortable" data-sort="likes">Likes</th>
          <th id="likedHeader">Liked by</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>No messages match these filters.</div>
  </div>
</main>

<script>
// Snapshot written by export_static.py
// rows: t = epoch seconds, s = sender, x = text, n = like count, l = liked by, nl = hasn't liked
const DATA = /*__DATA__*/null;
const MAX_ROWS = 1000;
const $ = id => document.getElementById(id);
let debounce;

if (DATA.group) { $('title').textContent = DATA.group; document.title = DATA.group + ' · Likes'; }

function fmtTime(ts) {
  return new Date(ts * 1000).toLocaleString(undefined, {
    year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'
  });
}

function td(cls, text) {
  const el = document.createElement('td');
  el.className = cls;
  el.textContent = text ?? '';
  return el;
}

function render() {
  const [sort, dir] = $('sort').value.split(':');
  const notLiked = $('notliked').checked;
  const label = notLiked ? "Hasn't liked" : 'Liked by';
  $('likedHeader').textContent = label;
  $('likerLabel').textContent = label;

  // "From" starts at local midnight; "To" covers the whole selected day.
  const start = $('from').value ? new Date($('from').value + 'T00:00').getTime() / 1000 : null;
  let end = null;
  if ($('to').value) {
    const d = new Date($('to').value + 'T00:00');
    d.setDate(d.getDate() + 1);
    end = d.getTime() / 1000;
  }
  const who = $('liker').value.trim().toLowerCase();

  const rows = DATA.rows.filter(r =>
    (!$('zero').checked || r.n === 0) &&
    (start === null || r.t >= start) &&
    (end === null || r.t < end) &&
    (!who || (notLiked ? r.nl : r.l).some(name => name.toLowerCase().includes(who)))
  );
  const sign = dir === 'asc' ? 1 : -1;
  rows.sort(sort === 'likes'
    ? (a, b) => sign * (a.n - b.n) || b.t - a.t
    : (a, b) => sign * (a.t - b.t));

  const shown = rows.slice(0, MAX_ROWS);
  const tbody = $('rows');
  tbody.replaceChildren();
  for (const r of shown) {
    const tr = document.createElement('tr');
    tr.append(
      td('time', fmtTime(r.t)),
      td('sender', r.s),
      td('text', r.x || '(no text — attachment)'),
      td('likes', r.n),
      td('likedby', (notLiked ? r.nl : r.l).join(', ') || '—'),
    );
    tbody.append(tr);
  }
  $('empty').hidden = shown.length > 0;

  const count = shown.length < rows.length
    ? `Showing first ${shown.length} of ${rows.length} matches`
    : `${rows.length} match${rows.length === 1 ? '' : 'es'}`;
  $('status').textContent = `${count} · snapshot of ${DATA.rows.length} messages as of ${fmtTime(DATA.exported)}`;
}

['sort', 'zero', 'notliked', 'from', 'to'].forEach(id => $(id).addEventListener('change', render));
$('liker').addEventListener('input', () => { clearTimeout(debounce); debounce = setTimeout(render, 150); });
document.querySelectorAll('th.sortable').forEach(th => th.addEventListener('click', () => {
  const [cur, dir] = $('sort').value.split(':');
  const key = th.dataset.sort;
  $('sort').value = `${key}:${cur === key && dir === 'desc' ? 'asc' : 'desc'}`;
  render();
}));

render();
</script>
</body>
</html>
