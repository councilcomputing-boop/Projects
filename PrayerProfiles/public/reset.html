<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Prayer Profiles</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,440;0,9..144,650&family=Instrument+Sans:wght@400;500;600;700&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #f5efe2; --surface: #faf6ec; --border: rgba(38,35,32,0.14);
      --text: #262320; --text2: #746f63; --gold: #b8863c; --gold-deep: #8f6527;
      --green: #6f8a5e; --red: #b5603c;
    }
    body {
      font-family: 'Instrument Sans', system-ui, sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 380px; background: var(--surface);
      border: 1px solid var(--border); border-radius: 20px;
      padding: 32px 28px; box-shadow: 0 8px 30px rgba(38,35,32,0.08);
    }
    .logo { width: 48px; height: 48px; border-radius: 13px; overflow: hidden; margin: 0 auto 16px; }
    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    h1 {
      font-family: 'Fraunces', Georgia, serif; font-size: 22px; font-weight: 650;
      text-align: center; margin-bottom: 6px;
    }
    .sub { font-size: 13px; color: var(--text2); text-align: center; margin-bottom: 24px; }
    .fg { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    label { font-size: 12px; font-weight: 600; color: var(--text2); }
    input {
      padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px;
      font-size: 14px; outline: none; background: #fff; font-family: inherit; color: var(--text);
    }
    input:focus { border-color: var(--gold); }
    button {
      width: 100%; padding: 11px; margin-top: 6px; border: none; border-radius: 10px;
      background: var(--gold); color: #fff; font-weight: 600; font-size: 14px;
      cursor: pointer; font-family: inherit;
    }
    button:hover { background: var(--gold-deep); }
    button:disabled { opacity: 0.6; cursor: default; }
    .msg { font-size: 12.5px; font-weight: 600; text-align: center; min-height: 16px; margin-top: 12px; }
    .msg.err { color: var(--red); }
    .msg.ok { color: var(--green); }
    a.back { display: block; text-align: center; margin-top: 16px; font-size: 13px; color: var(--gold); text-decoration: none; }
    a.back:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="/icon-192.png" alt="Prayer Profiles"></div>
    <h1>Choose a new password</h1>
    <p class="sub">Enter a new password for your account below.</p>

    <div id="form">
      <div class="fg">
        <label>New password</label>
        <input id="pw1" type="password" placeholder="At least 8 characters" autocomplete="new-password">
      </div>
      <div class="fg">
        <label>Confirm password</label>
        <input id="pw2" type="password" placeholder="Re-enter password" autocomplete="new-password">
      </div>
      <button id="submit-btn" onclick="doReset()">Update Password</button>
    </div>
    <p class="msg" id="msg"></p>
    <a class="back" href="/">← Back to Prayer Profiles</a>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const token  = params.get('token') || '';
    const msgEl  = document.getElementById('msg');

    if (!token) {
      document.getElementById('form').style.display = 'none';
      msgEl.className = 'msg err';
      msgEl.textContent = 'This reset link is missing its token. Request a new one from the sign-in screen.';
    }

    async function doReset() {
      const pw1 = document.getElementById('pw1').value;
      const pw2 = document.getElementById('pw2').value;
      msgEl.className = 'msg'; msgEl.textContent = '';

      if (pw1.length < 8) { msgEl.className = 'msg err'; msgEl.textContent = 'Password must be at least 8 characters'; return; }
      if (pw1 !== pw2)    { msgEl.className = 'msg err'; msgEl.textContent = 'Passwords do not match'; return; }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      try {
        const r = await fetch('/api/auth/reset-password', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pw1 }),
        });
        const data = await r.json();
        if (!r.ok) { msgEl.className = 'msg err'; msgEl.textContent = data.error || 'Something went wrong'; btn.disabled = false; return; }
        document.getElementById('form').style.display = 'none';
        msgEl.className = 'msg ok';
        msgEl.textContent = 'Password updated — you can now sign in from the app.';
      } catch {
        msgEl.className = 'msg err'; msgEl.textContent = 'Network error — please try again';
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
